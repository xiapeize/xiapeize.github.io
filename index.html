<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #777777;
    --line: #e5e5e5;
    --accent: #111111;
    --max: 520px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  ::selection { background: #111; color: #fff; }

  .wrap { width: min(100% - 44px, var(--max)); margin: 0 auto; }

  main { padding: 120px 0 120px; }

  .intro { text-align: center; }
  .intro h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.4px;
    margin-bottom: 16px;
  }
  .intro p { color: var(--muted); }
  .intro p a {
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s, color 0.2s;
  }
  .intro p a:hover { color: var(--text); border-color: var(--text); }

  .links {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 40px;
  }
  .links a {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 14px 20px;
    font-size: 15px; font-weight: 500;
    text-decoration: none;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    transition: border-color 0.2s, background 0.2s, transform 0.2s;
  }
  .links a:hover {
    border-color: var(--text);
    background: #f7f7f7;
    transform: translateY(-1px);
  }
  .links a svg {
    width: 18px; height: 18px;
    fill: currentColor;
    flex-shrink: 0;
  }

  .more {
    margin-top: 28px;
    text-align: center;
  }
  .more a {
    font-size: 14.5px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
    transition: border-color 0.2s;
  }
  .more a:hover { border-color: var(--accent); }

  @media (max-width: 520px) {
    main { padding: 80px 0 88px; }
    .links a { padding: 13px 18px; font-size: 14.5px; }
  }
</style>
