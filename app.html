<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps · xiapeize</title>
<style>
  :root { --bg:#fff; --text:#111; --muted:#777; --line:#e5e5e5; --max:520px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.8; font-size:16px; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:#111; color:#fff; }
  .wrap { width:min(100% - 44px, var(--max)); margin:0 auto; }
  main { padding:96px 0 120px; }
  .back { display:inline-block; font-size:14px; color:var(--muted); margin-bottom:40px; transition:color .2s; }
  .back:hover { color:var(--text); }
  h1 { font-size:30px; font-weight:600; letter-spacing:-.4px; margin-bottom:28px; }
  .app-list { display:flex; flex-direction:column; }
  .app { display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--line);
    transition:padding-left .2s; }
  .app:hover { padding-left:6px; }
  .app .icon { width:46px; height:46px; flex-shrink:0; border-radius:11px; border:1px solid var(--line);
    display:grid; place-items:center; overflow:hidden; background:#fafafa; }
  .app .icon img { width:100%; height:100%; object-fit:cover; display:block; }
  .app .icon span { font-size:17px; font-weight:600; color:var(--muted); text-transform:uppercase; }
  .app .info { min-width:0; }
  .app .info h3 { font-size:15.5px; font-weight:600; margin-bottom:1px; }
  .app .info p { font-size:14px; color:var(--muted); }
  .app .arrow { margin-left:auto; color:var(--muted); flex-shrink:0; }
  @media (max-width:520px) { main { padding:64px 0 88px; } }
</style>
</head>
<body>
<main class="wrap">
  <a href="/" class="back">&larr; 返回首页</a>
  <h1>Apps</h1>
  <div class="app-list">

  </div>
</main>
</body>
</html>
