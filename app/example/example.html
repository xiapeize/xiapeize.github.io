<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Example · xiapeize</title>
<style>
  :root { --bg:#fff; --text:#111; --muted:#777; --line:#e5e5e5; --max:520px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.8; font-size:16px; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:#111; color:#fff; }
  .wrap { width:min(100% - 44px, var(--max)); margin:0 auto; }
  main { padding:96px 0 120px; }
  .back { display:inline-block; font-size:14px; color:var(--muted); margin-bottom:40px; transition:color .2s; }
  .back:hover { color:var(--text); }
  h1 { font-size:30px; font-weight:600; letter-spacing:-.4px; margin-bottom:12px; }
  .head { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
  .head img { width:52px; height:52px; border-radius:12px; border:1px solid var(--line); background:#fafafa; }
  .head h1 { margin-bottom:2px; }
  .head p { font-size:14px; color:var(--muted); }
  .body p { color:var(--muted); margin-bottom:12px; }
  @media (max-width:520px) { main { padding:64px 0 88px; } }
</style>
</head>
<body>
<main class="wrap">
  <a href="/app.html" class="back">&larr; 返回 Apps</a>
  <div class="head">
    <img src="example.svg" alt="">
    <div>
      <h1>Example</h1>
      <p>应用描述</p>
    </div>
  </div>
  <div class="body">
    <p>这里写应用内容。</p>
  </div>
</main>
</body>
</html>
